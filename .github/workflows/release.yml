name: Build & Attach Signed Release APK

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Decode signing keystore
        run: echo "${{ secrets.SIGNING_KEY }}" | base64 -d > "${{ github.workspace }}/release-keystore.p12"

      - name: Diagnose keystore (alias / password)
        run: |
          keytool -list -keystore "${{ github.workspace }}/release-keystore.p12" -storetype PKCS12 -storepass "${{ secrets.KEYSTORE_PASSWORD }}" > diag.txt 2>&1 || true
          echo "---- keytool -list ----"
          cat diag.txt

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-keystore.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report diagnostics to release body
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REL_ID: ${{ github.event.release.id }}
        run: |
          {
            echo "## CI Diagnostics"
            echo ""
            echo "### keytool -list"
            echo '```'
            cat diag.txt
            echo '```'
            echo ""
            echo "### gradle assembleRelease (tail)"
            echo '```'
            tail -50 build.log
            echo '```'
          } > report.md
          {
            echo "## CI Diagnostics"
            echo ""
            echo "### keytool -list"
            echo '```'
            cat diag.txt
            echo '```'
            echo ""
            echo "### gradle assembleRelease (key error lines)"
            echo '```'
            grep -nE "What went wrong|BUILD FAILED|Execution failed|> Task :app:|FAILURE|e: |error:|Exception|signing|SigningConfig|storeType|keyPassword|keystore|Keystore|Caused by|Could not" build.log | head -70
            echo '```'
          } > report.md
          BODY=$(python3 -c 'import sys,json; print(json.dumps(open("report.md").read()))')
          curl -s -X PATCH -H "Authorization: token $GITHUB_TOKEN" -H "Content-Type: application/json" -d "{\"body\":$BODY}" "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$REL_ID"
